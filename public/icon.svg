<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="40%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#022c22" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded squircle / circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle inner border ring -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="#34d399" stroke-width="6" stroke-opacity="0.35" />

  <!-- Main emblem group -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Primary Tea Leaf (Left) -->
    <path d="M 256 120 C 180 180 140 280 230 360 C 260 330 275 250 256 120 Z" fill="url(#leafGrad)" />
    <!-- Secondary Tea Leaf (Right) -->
    <path d="M 256 160 C 330 200 360 290 280 370 C 255 335 250 260 256 160 Z" fill="url(#leafGrad)" opacity="0.92" />
    <!-- Central Leaf Vein -->
    <path d="M 256 120 Q 248 240 252 380" stroke="#065f46" stroke-width="8" stroke-linecap="round" fill="none" />

    <!-- Hazelnut / Fındık badge in bottom right overlap -->
    <g transform="translate(290, 270)">
      <!-- Hazelnut cap (yeşil çotanak yaprağı) -->
      <path d="M 10 30 Q 30 -5 55 10 Q 75 -8 90 25 Q 110 50 85 85 Q 30 95 10 30 Z" fill="#10b981" />
      <!-- Hazelnut shell body -->
      <path d="M 25 35 C 30 15 70 15 80 38 C 90 65 75 90 52 92 C 30 90 15 65 25 35 Z" fill="url(#goldGrad)" stroke="#b45309" stroke-width="3" />
      <!-- Hazelnut base lighter mark -->
      <ellipse cx="52" cy="36" rx="20" ry="10" fill="#fde68a" opacity="0.9" />
    </g>

    <!-- Small sprout highlight -->
    <circle cx="256" cy="122" r="10" fill="#fef08a" />
  </g>

  <!-- App name banner text (stylized) -->
  <text x="256" y="442" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="1">
    TARIM CEPTE
  </text>
  <text x="256" y="475" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#86efac" letter-spacing="4">
    KARADENİZ
  </text>
</svg>
